# Keeps the Render free web service awake: it sleeps after 15 min without traffic,
# which would pause the document queue and the SEFAZ capture job.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 https://autonf-web.onrender.com/health
